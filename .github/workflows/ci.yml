name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Verify
    uses: maveniverse/parent/.github/workflows/ci.yml@release-65
    with:
      maven-matrix: '[ "3.10.2", "4.0.0-rc-7" ]'
      jdk-matrix: '[ "17", "21", "25" ]'
      maven-test: './mvnw clean verify -e -B -V -P run-its -f it'

