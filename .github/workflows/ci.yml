name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Verify
    uses: maveniverse/parent/.github/workflows/ci.yml@release-59
    with:
      jdk-matrix: '[ "17", "21", "25" ]'
      maven-matrix: '[ "3.9.16", "3.10.0-rc-1", "4.0.0-rc-6" ]'
      maven-test: './mvnw clean verify -e -B -V -P run-its -f it'

